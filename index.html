<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل مورّد جديد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#13283b; --ink-soft:#4a5d6e; --paper:#f5f7f9; --card:#ffffff;
  --line:#d3dce4; --teal:#0e7c86; --teal-dark:#0a5f67; --teal-tint:#e4f2f3;
  --danger:#b3261e; --ok:#1b7a4b;
  --font:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--paper);color:var(--ink);line-height:1.7;font-size:16px}
.page{display:grid;grid-template-columns:minmax(300px,2fr) 3fr;min-height:100%}

/* side panel */
.side{background:var(--ink);color:#e9eff4;padding:56px 48px;display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.side h1{font-size:2.4rem;line-height:1.3;font-weight:700;letter-spacing:-.01em;max-width:14ch}
.side .lead{margin-top:16px;color:#b9c7d3;max-width:34ch}
.prep{border-top:1px solid #2b445a;padding-top:24px;display:grid;gap:18px}
.prep h2{font-size:1rem;font-weight:600;color:#fff}
.prep ul{list-style:none;padding:0;display:grid;gap:14px}
.prep li{display:flex;gap:12px;color:#c9d5df;font-size:.95rem}
.prep svg{flex:none;margin-top:5px;color:#6fd0d8}

/* form */
.main{display:flex;align-items:center;justify-content:center;padding:48px 24px}
form{width:100%;max-width:560px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:36px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.field{display:grid;gap:6px;margin-bottom:20px}
label,.lbl{font-weight:600;font-size:.95rem}
.hint{font-weight:400;color:var(--ink-soft);font-size:.85rem}
input[type=text],input[type=email],input[type=tel]{
  width:100%;font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);
  border-radius:8px;padding:11px 14px;transition:border-color .15s,box-shadow .15s}
input::placeholder{color:#93a2af}
input:focus-visible{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(14,124,134,.18)}
input.ltr{direction:ltr;text-align:right}
input:user-invalid{border-color:var(--danger)}

/* file drop zone */
.drop{display:flex;align-items:center;gap:16px;border:2px dashed #9fb4c3;border-radius:12px;padding:22px;cursor:pointer;background:#fafcfd;transition:background .15s,border-color .15s}
.drop:hover,.drop.over{background:var(--teal-tint);border-color:var(--teal)}
.drop:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px rgba(14,124,134,.18)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop .ico{flex:none;width:46px;height:46px;border-radius:10px;background:var(--teal-tint);color:var(--teal-dark);display:grid;place-items:center}
.drop .txt{display:grid;min-width:0}
.drop strong{font-weight:600}
.drop small{color:var(--ink-soft)}
.drop.has{border-style:solid;border-color:var(--teal);background:var(--teal-tint)}
.drop .name{direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.err{color:var(--danger);font-size:.85rem;min-height:1.2em}

button.send{width:100%;margin-top:8px;font:inherit;font-weight:600;font-size:1.05rem;color:#fff;background:var(--teal);border:0;border-radius:10px;padding:14px;cursor:pointer;transition:background .15s}
button.send:hover{background:var(--teal-dark)}
button.send:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button.send:disabled{background:#7aa9ad;cursor:wait}

.status{margin-top:18px;border-radius:10px;padding:14px 16px;display:none;font-size:.95rem}
.status.show{display:block}
.status.ok{background:#e6f4ec;color:var(--ok);border:1px solid #b9dfc9}
.status.bad{background:#fbeceb;color:var(--danger);border:1px solid #f0c4c1}
.status b{display:block;margin-bottom:2px}

@media (max-width:860px){
  .page{grid-template-columns:1fr}
  .side{padding:36px 24px;gap:28px}
  .side h1{font-size:1.9rem}
  .main{padding:28px 16px 40px}
  form{padding:24px 20px}
}
@media (max-width:520px){.row{grid-template-columns:1fr;gap:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="page">
  <aside class="side">
    <div>
      <h1>تسجيل مورّد جديد</h1>
      <p class="lead">أرسل بيانات شركتك ومستندًا واحدًا، وسنضيفها إلى قائمة الموردين.</p>
    </div>
    <div class="prep">
      <h2>قبل أن تبدأ</h2>
      <ul>
        <li><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>جهّز المستند بصيغة PDF، مثل البطاقة الضريبية أو السجل التجاري.</li>
        <li><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>الحد الأقصى لحجم الملف 10 ميجابايت.</li>
        <li><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>تأكد من صحة البريد ورقم الهاتف للتواصل معك.</li>
      </ul>
    </div>
  </aside>

  <main class="main">
    <form id="supplierForm" novalidate>
      <div class="field">
        <label for="company_name">اسم الشركة</label>
        <input type="text" id="company_name" name="company_name" required autocomplete="organization" placeholder="مثال: Delta Supplies">
      </div>

      <div class="field">
        <label for="contact_person">الشخص المسؤول</label>
        <input type="text" id="contact_person" name="contact_person" required autocomplete="name" placeholder="مثال: Omar Adel">
      </div>

      <div class="row">
        <div class="field">
          <label for="email">البريد الإلكتروني</label>
          <input class="ltr" type="email" id="email" name="email" required autocomplete="email" placeholder="omar@delta.com">
        </div>
        <div class="field">
          <label for="phone">رقم الهاتف</label>
          <input class="ltr" type="tel" id="phone" name="phone" required autocomplete="tel" inputmode="numeric" pattern="01[0125][0-9]{8}" maxlength="11" placeholder="01123456789">
        </div>
      </div>

      <div class="field">
        <span class="lbl">المستند <span class="hint">(PDF)</span></span>
        <label class="drop" id="drop">
          <input type="file" id="document" name="document" accept="application/pdf,.pdf" required>
          <span class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg></span>
          <span class="txt">
            <strong id="dropTitle">اختر ملف PDF أو اسحبه هنا</strong>
            <small id="dropSub">حتى 10 ميجابايت</small>
          </span>
        </label>
        <div class="err" id="fileErr" role="alert"></div>
      </div>

      <button class="send" type="submit" id="sendBtn">إرسال البيانات</button>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </form>
  </main>
</div>

<script>
// ضع هنا رابط الـ Webhook من n8n.
// للتجربة: Test URL (اضغط Listen for test event قبل كل إرسال).
// بعد تفعيل الـ workflow: Production URL (الذي يحتوي /webhook/ بدل /webhook-test/).
const WEBHOOK_URL = "https://shenouda10.app.n8n.cloud/webhook-test/supplier-intake";
const MAX_MB = 10;

const form = document.getElementById("supplierForm");
const fileInput = document.getElementById("document");
const drop = document.getElementById("drop");
const dropTitle = document.getElementById("dropTitle");
const dropSub = document.getElementById("dropSub");
const fileErr = document.getElementById("fileErr");
const statusBox = document.getElementById("status");
const btn = document.getElementById("sendBtn");

function fmtSize(b){ return b < 1048576 ? Math.max(1, Math.round(b/1024)) + " KB" : (b/1048576).toFixed(1) + " MB"; }

function resetFile(){
  drop.classList.remove("has");
  dropTitle.textContent = "اختر ملف PDF أو اسحبه هنا";
  dropTitle.classList.remove("name");
  dropSub.textContent = "حتى 10 ميجابايت";
}

function checkFile(){
  fileErr.textContent = "";
  const f = fileInput.files[0];
  if(!f){ resetFile(); return false; }
  const isPdf = f.type === "application/pdf" || /\.pdf$/i.test(f.name);
  if(!isPdf){ fileErr.textContent = "الملف يجب أن يكون بصيغة PDF."; fileInput.value = ""; resetFile(); return false; }
  if(f.size > MAX_MB*1048576){ fileErr.textContent = "حجم الملف أكبر من " + MAX_MB + " ميجابايت."; fileInput.value = ""; resetFile(); return false; }
  drop.classList.add("has");
  dropTitle.textContent = f.name;
  dropTitle.classList.add("name");
  dropSub.textContent = fmtSize(f.size) + " · اضغط لتغيير الملف";
  return true;
}

fileInput.addEventListener("change", checkFile);
["dragenter","dragover"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", ev => {
  if(ev.dataTransfer.files.length){
    const dt = new DataTransfer();
    dt.items.add(ev.dataTransfer.files[0]);
    fileInput.files = dt.files;
    checkFile();
  }
});

function show(type, title, msg){
  statusBox.className = "status show " + type;
  statusBox.innerHTML = "<b>" + title + "</b>" + msg;
}

form.addEventListener("submit", async ev => {
  ev.preventDefault();
  statusBox.className = "status";
  if(!form.checkValidity() || !checkFile()){
    form.reportValidity();
    if(!fileInput.files.length) fileErr.textContent = "أرفق ملف PDF قبل الإرسال.";
    return;
  }
  btn.disabled = true;
  btn.textContent = "جارٍ الإرسال...";
  try{
    const res = await fetch(WEBHOOK_URL, { method: "POST", body: new FormData(form) });
    if(!res.ok) throw new Error("HTTP " + res.status);
    show("ok", "تم استلام بياناتك", "حُفظ المستند وسُجّلت الشركة في قائمة الموردين.");
    form.reset(); resetFile();
  }catch(err){
    show("bad", "تعذّر الإرسال", "تحقق من اتصالك بالإنترنت وحاول مرة أخرى. إن استمرت المشكلة تواصل مع مسؤول النظام.");
    console.error(err);
  }finally{
    btn.disabled = false;
    btn.textContent = "إرسال البيانات";
  }
});
</script>
</body>
</html>
